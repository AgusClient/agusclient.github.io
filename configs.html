<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configs Players // AClient</title>
  <meta name="description" content="Configuraciones verificadas de jugadores de AClient para DDNet: cl_mouse_max_distance, resolución y Hz.">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="canonical" href="https://agusclient.github.io/configs.html">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">

  <style>
    .configs-main {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 132px 24px 96px;
      min-height: calc(100vh - 120px);
    }

    .configs-hero {
      text-align: center;
      margin-bottom: 42px;
    }

    .configs-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-text);
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.30);
      margin-bottom: 16px;
    }

    .configs-eyebrow .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary);
    }

    .configs-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.35rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--accent-gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .configs-subtitle {
      max-width: 620px;
      margin: 0 auto;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .configs-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(14px);
    }

    .configs-toolbar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex: 1 1 320px;
    }

    .configs-search {
      flex: 1 1 240px;
      max-width: 360px;
      background: rgba(5, 6, 8, 0.72);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: var(--font-body);
      font-size: 0.92rem;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .configs-search:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.16);
    }

    .configs-select {
      background: rgba(5, 6, 8, 0.72);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--font-body);
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
    }

    .configs-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .configs-count-pill {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
    }

    .configs-refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }

    .configs-refresh-btn:hover:not(:disabled) {
      border-color: var(--accent-primary);
      background: rgba(139, 92, 246, 0.14);
    }

    .configs-refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .configs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }

    .player-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      border-radius: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(14px);
      transition: transform var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast);
    }

    .player-card:hover {
      transform: translateY(-3px);
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .player-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .player-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .player-avatar {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      background: var(--accent-gradient);
      box-shadow: 0 6px 20px var(--accent-glow);
      text-transform: uppercase;
    }

    .player-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .verified-badge {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.32);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .player-specs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .spec-box {
      padding: 11px 10px;
      border-radius: 12px;
      background: rgba(5, 6, 8, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spec-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .spec-value {
      font-family: var(--font-mono);
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .player-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .player-date {
      font-size: 0.76rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .copy-cmd-btn {
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid rgba(139, 92, 246, 0.35);
      background: rgba(139, 92, 246, 0.14);
      color: var(--accent-text);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }

    .copy-cmd-btn:hover {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    .configs-state {
      text-align: center;
      padding: 64px 20px;
      border-radius: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .configs-state h3 {
      font-family: var(--font-display);
      color: var(--text-main);
      margin-bottom: 8px;
      font-size: 1.2rem;
    }

    .nav-link.active {
      color: var(--text-main);
    }

    .nav-link.active::after {
      width: 100%;
    }

    .configs-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      padding: 11px 16px;
      border-radius: 12px;
      background: rgba(15, 18, 28, 0.95);
      border: 1px solid rgba(139, 92, 246, 0.45);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .configs-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .configs-main {
        padding: 106px 16px 64px;
      }
      .player-specs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header scrolled">
    <div class="nav-container">
      <a href="./" class="brand-logo">
        <div class="logo-symbol"><picture><source srcset="assets/images/logo.webp" type="image/webp"><img src="assets/images/logo.png" alt="AClient" width="320" height="400" decoding="async"></picture></div>
        <span class="logo-text">ACLIENT</span>

            <line x1="4" y1="21" x2="4" y2="14"></line>

        </a>

        <a href="https://github.com/AgusClient/AClient" class="btn-github-nav" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository" title="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">

  <main class="configs-main">
    <section class="configs-hero">
      <div class="configs-eyebrow">
        <span class="dot"></span>
        <span>ACLIENT // CONFIGS VERIFICADAS</span>
      </div>
      <h1 class="configs-title">CONFIGS PLAYERS</h1>
      <p class="configs-subtitle">
        Configuraciones aprobadas enviadas directamente desde AClient: distancia de mouse, resolución y tasa de refresco de cada jugador.
      </p>
    </section>

    <section class="configs-toolbar" aria-label="Filtros">
      <div class="configs-toolbar-left">
        <input id="searchInput" class="configs-search" type="search" placeholder="Buscar jugador, resolución o Hz..." autocomplete="off">
        <select id="sortSelect" class="configs-select" aria-label="Ordenar por">
          <option value="recent">Más recientes</option>
          <option value="name">Nombre (A-Z)</option>
          <option value="hz">Mayor Hz</option>
          <option value="distance">Mayor Max Distance</option>
        </select>
      </div>
      <div class="configs-toolbar-right">
        <span id="countPill" class="configs-count-pill">Cargando...</span>
        <button id="refreshBtn" class="configs-refresh-btn" type="button">Actualizar</button>
      </div>
    </section>

    <section id="configsContainer" class="configs-grid" aria-live="polite"></section>
    <div id="stateBox" class="configs-state" style="display:none;"></div>
  </main>

  <div id="toast" class="configs-toast" role="status" aria-live="polite"></div>

  <script>
    const SUPABASE_URL = "https://hmrgihzjynnnappzbvdd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pvDz7mWQ0e2qD4Q9tkyNKw_KEHQx8L6";

    let approvedConfigs = [];

    const container = document.getElementById("configsContainer");
    const stateBox = document.getElementById("stateBox");
    const countPill = document.getElementById("countPill");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const refreshBtn = document.getElementById("refreshBtn");
    const toastEl = document.getElementById("toast");

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => toastEl.classList.remove("show"), 2400);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleDateString("es-AR", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit"
      });
    }

    function getInitial(name) {
      const clean = String(name || "?").trim();
      return clean ? clean[0].toUpperCase() : "?";
    }

    function renderConfigs() {
      const q = searchInput.value.trim().toLowerCase();
      const sort = sortSelect.value;

      let list = approvedConfigs.filter((item) => {
        if (!q) return true;
        const hay = `${item.player_name} ${item.resolution} ${item.hz} ${item.cl_mouse_max_distance}`.toLowerCase();
        return hay.includes(q);
      });

      list = [...list].sort((a, b) => {
        if (sort === "name") return String(a.player_name).localeCompare(String(b.player_name));
        if (sort === "hz") return Number(b.hz) - Number(a.hz);
        if (sort === "distance") return Number(b.cl_mouse_max_distance) - Number(a.cl_mouse_max_distance);
        return new Date(b.updated_at || 0).getTime() - new Date(a.updated_at || 0).getTime();
      });

      countPill.textContent = list.length === 1 ? "1 jugador" : `${list.length} jugadores`;
      container.innerHTML = "";

      if (list.length === 0) {
        stateBox.style.display = "block";
        stateBox.innerHTML = approvedConfigs.length === 0
          ? "<h3>Todavía no hay configuraciones publicadas</h3><p>Subí la tuya desde AClient (Settings → AClient → Guardar Configuracion en la BD) y aparecerá acá una vez aprobada.</p>"
          : "<h3>Sin resultados</h3><p>No se encontraron jugadores que coincidan con tu búsqueda.</p>";
        return;
      }

      stateBox.style.display = "none";

      for (const item of list) {
        const card = document.createElement("article");
        card.className = "player-card";
        const cmd = `cl_mouse_max_distance ${Number(item.cl_mouse_max_distance)}`;
        card.innerHTML = `
          <div class="player-card-head">
            <div class="player-identity">
              <div class="player-avatar">${escapeHtml(getInitial(item.player_name))}</div>
              <div class="player-name" title="${escapeHtml(item.player_name)}">${escapeHtml(item.player_name)}</div>
            </div>
            <span class="verified-badge">Aprobado</span>
          </div>
          <div class="player-specs">
            <div class="spec-box">
              <span class="spec-label">Max Distance</span>
              <span class="spec-value">${escapeHtml(item.cl_mouse_max_distance)}</span>
            </div>
            <div class="spec-box">
              <span class="spec-label">Resolución</span>
              <span class="spec-value">${escapeHtml(item.resolution)}</span>
            </div>
            <div class="spec-box">
              <span class="spec-label">Monitor</span>
              <span class="spec-value">${escapeHtml(item.hz)} Hz</span>
            </div>
          </div>
          <div class="player-card-foot">
            <span class="player-date">${escapeHtml(formatDate(item.updated_at))}</span>
            <button class="copy-cmd-btn" type="button" data-cmd="${escapeHtml(cmd)}">Copiar max_distance</button>
          </div>
        `;
        container.appendChild(card);
      }
    }

    async function fetchApprovedConfigs() {
      refreshBtn.disabled = true;
      if (approvedConfigs.length === 0) {
        stateBox.style.display = "block";
        stateBox.innerHTML = "<h3>Cargando configuraciones...</h3><p>Obteniendo lista de jugadores aprobados.</p>";
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_approved_player_configs`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
          },
          body: "{}"
        });

        const data = await res.json().catch(() => null);
        if (!res.ok || !Array.isArray(data)) {
          throw new Error((data && (data.message || data.error)) || `HTTP ${res.status}`);
        }

        approvedConfigs = data;
        renderConfigs();
      } catch (err) {
        container.innerHTML = "";
        countPill.textContent = "Error";
        stateBox.style.display = "block";
        stateBox.innerHTML = `<h3>No se pudieron cargar las configs</h3><p>${escapeHtml(err.message)}</p>`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    searchInput.addEventListener("input", renderConfigs);
    sortSelect.addEventListener("change", renderConfigs);
    refreshBtn.addEventListener("click", fetchApprovedConfigs);

    container.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-cmd]");
      if (!btn) return;
      const cmd = btn.getAttribute("data-cmd");
      try {
        await navigator.clipboard.writeText(cmd);
        showToast(`Copiado: ${cmd}`);
      } catch (_) {
        showToast(cmd);
      }
    });

    fetchApprovedConfigs();
  </script>
